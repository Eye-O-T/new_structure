[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cctv-configurator"
version = "0.3.0"
description = "Windows setup GUI and CLI for AI CCTV"
requires-python = ">=3.11,<3.12"
dependencies = ["ai-cctv-core==0.3.0", "argon2-cffi==23.1.0", "PyQt5==5.15.11"]

[project.optional-dependencies]
test = ["pytest==8.3.4", "ruff==0.9.5"]
build = ["PyInstaller==6.11.1"]

[project.scripts]
ai-cctv-server = "configurator.cli:main"

[tool.uv.sources]
ai-cctv-core = { path = "../lib", editable = true }

[tool.uv]
# Linux 전용 최신 Qt 배포판이 Windows 잠금 파일에 선택되는 것을 막는다.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

# 기존 configurator import와 소스 경로를 유지한다.
[tool.setuptools]
packages = ["configurator"]
package-dir = { configurator = "." }

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["..", "../lib"]
testpaths = ["tests"]
