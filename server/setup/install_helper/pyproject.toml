[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cctv-server-install-helper"
version = "0.3.0"
description = "Windows installation and host management helper for AI CCTV"
requires-python = ">=3.11,<3.12"
dependencies = ["ai-cctv-core==0.3.0", "ai-cctv-server-setup==0.3.0", "PyQt5==5.15.11"]

[project.optional-dependencies]
test = ["pytest==8.3.4", "ruff==0.9.5"]
build = ["PyInstaller==6.11.1"]

[project.scripts]
ai-cctv-server = "server.setup.install_helper.cli:main"

[tool.uv.sources]
ai-cctv-core = { path = "../../../lib", editable = true }
ai-cctv-server-setup = { path = "..", editable = true }

[tool.uv]
# Linux 전용 최신 Qt 배포판이 Windows 잠금 파일에 선택되는 것을 막는다.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

# 호스트 도구만 설치하며 컨테이너 서비스는 포함하지 않는다.
[tool.setuptools]
packages = ["server.setup.install_helper"]
package-dir = { "server.setup.install_helper" = "." }

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["../../..", "../../../lib"]
testpaths = ["tests", "../tests"]
