[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cctv-server-setup"
version = "0.3.0"
description = "Configuration generation and validation for AI CCTV servers"
requires-python = ">=3.11,<3.12"
dependencies = ["ai-cctv-core==0.3.0", "argon2-cffi==23.1.0"]

[tool.uv.sources]
ai-cctv-core = { path = "../../lib", editable = true }

[tool.setuptools]
packages = ["server.setup", "server.setup.tools"]
package-dir = { "server.setup" = ".", "server.setup.tools" = "tools" }
