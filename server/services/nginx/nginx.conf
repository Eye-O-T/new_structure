# 외부 HTTPS 요청을 API 또는 영상 서버로 전달하고 영상마다 접근 권한을 검사한다.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 토큰이 들어갈 수 있는 원본 쿼리 전체 대신 URI 등 필요한 항목만 로그에 남긴다.
    log_format structured escape=json
        '{"timestamp":"$time_iso8601",'
        '"service":"nginx",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time}';

    access_log /var/log/nginx/access.log structured;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # upstream은 요청을 넘길 대상이다. Docker 서비스 이름을 호스트 이름으로 쓴다.
    upstream external_service {
        server external:8000;
        keepalive 16;
    }

    upstream data_service {
        server data:8000;
        keepalive 16;
    }

    upstream mediamtx_hls {
        server mediamtx:8888;
        keepalive 16;
    }

    upstream mediamtx_playback {
        server mediamtx:9996;
        keepalive 16;
    }

    upstream mediamtx_api {
        server mediamtx:9997;
        keepalive 8;
    }

    # 80번은 Nginx 자체 상태 확인과 HTTPS 이동 안내에만 사용한다.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    # 앱이 접속하는 공개 443번이다. TLS로 앱과 Nginx 사이 통신을 암호화한다.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # 관리자 화면도 External에서 제공하며 실제 권한은 각 API에서 검사한다.
        location = /admin {
            proxy_pass http://external_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /admin/ {
            proxy_pass http://external_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # 끝에 /를 붙이지 않아 External에 /api/v1 경로를 그대로 전달한다.
        location ^~ /api/ {
            proxy_pass http://external_service;
            # Edge 설정 적용·되돌리기에 시간이 걸린다. 내부 작업보다 먼저 연결을 끊으면
            # 사용자가 적용 성공 여부를 모르게 되므로 더 긴 대기 시간을 준다.
            proxy_read_timeout 85s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # HLS는 재생목록과 여러 영상 조각으로 구성된다. 각 요청을 인증한 뒤
        # /hls/ 접두사를 떼어 MediaMTX가 이해하는 경로로 전달한다.
        location ^~ /hls/ {
            # 인코딩을 해석하는 단계마다 카메라 경로가 달라지지 않도록 모호한 URI를 거부한다.
            if ($request_uri ~ "^[^?]*%") { return 400; }
            auth_request /_auth;
            proxy_pass http://mediamtx_hls/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            add_header Cache-Control "private, no-store" always;
        }

        # Range는 파일의 일부 구간만 요청하는 헤더다. 탐색 재생을 위해 그대로 전달한다.
        location ^~ /playback/ {
            if ($request_uri ~ "^[^?]*%") { return 400; }
            auth_request /_auth;
            proxy_pass http://mediamtx_playback/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location = /_auth {
            internal;
            # 끝의 ?는 원래 쿼리를 제거한다. 권한 검사는 X-Original-URI로 전달한
            # 실제 영상 경로 하나를 기준으로 수행한다.
            proxy_pass http://external_service/internal/auth/verify?;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            # 앱이 주장한 카메라 ID를 신뢰하지 않고 실제 요청 경로에서 권한을 판정한다.
            proxy_set_header X-Camera-ID "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # 서비스 간 내부 API는 공개 HTTPS에서 접근할 수 없게 막는다.
        location ^~ /internal/ {
            return 404;
        }

        location / {
            return 404;
        }
    }

    # 컨테이너 사이 HTTP 중계용 8080이다. Compose에서 호스트 포트로 연결하지 않는다.
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        client_max_body_size 2m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # 끝의 /로 경로를 치환한다: /internal/data/v1/... → Data의 /internal/v1/...
        location ^~ /internal/data/v1/ {
            proxy_pass http://data_service/internal/v1/;
            proxy_set_header Host data;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Internal-Token $http_x_internal_token;
        }

        # Data의 준비 상태 경로도 내부 중계를 제공하여 External이 같은 경유지로 확인한다.
        location ^~ /internal/data/health/ {
            proxy_pass http://data_service/health/;
            proxy_set_header Host data;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Internal-Token $http_x_internal_token;
        }

        # /internal/media/를 떼면 MediaMTX 제어 API의 /v3/... 경로가 된다.
        location ^~ /internal/media/ {
            proxy_pass http://mediamtx_api/;
            proxy_set_header Host mediamtx;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            return 404;
        }
    }
}
