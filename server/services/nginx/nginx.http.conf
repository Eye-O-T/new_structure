events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 2m;
    upstream external_service { server external:8000; }
    upstream data_service { server data:8000; }
    upstream mediamtx_hls { server mediamtx:8888; }
    upstream mediamtx_playback { server mediamtx:9996; }
    upstream mediamtx_api { server mediamtx:9997; }

    server {
        listen 80;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
        location ^~ /api/ { proxy_pass http://external_service; proxy_read_timeout 85s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Request-ID $request_id; }
        location ^~ /hls/ { auth_request /_auth; proxy_pass http://mediamtx_hls/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http; proxy_buffering off; add_header Cache-Control "private, no-store" always; }
        location ^~ /playback/ { auth_request /_auth; proxy_pass http://mediamtx_playback/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto http; proxy_set_header Range $http_range; proxy_set_header If-Range $http_if_range; proxy_buffering off; proxy_read_timeout 300s; }
        location = /_auth { internal; proxy_pass http://external_service/internal/auth/verify?; proxy_pass_request_body off; proxy_set_header Content-Length ""; proxy_set_header Authorization $http_authorization; proxy_set_header Cookie $http_cookie; proxy_set_header X-Original-URI $request_uri; proxy_set_header X-Original-Method $request_method; proxy_set_header X-Forwarded-Proto http; }
        location ^~ /internal/ { return 404; }
        location / { return 404; }
    }
    server {
        listen 8080;
        server_name _;
        location = /healthz { access_log off; default_type text/plain; return 200 "ok"; }
        location ^~ /internal/data/v1/ { proxy_pass http://data_service/internal/v1/; proxy_set_header Host data; proxy_set_header X-Forwarded-Proto http; proxy_set_header X-Internal-Token $http_x_internal_token; }
        location ^~ /internal/data/health/ { proxy_pass http://data_service/health/; proxy_set_header Host data; proxy_set_header X-Forwarded-Proto http; proxy_set_header X-Internal-Token $http_x_internal_token; }
        location ^~ /internal/media/ { proxy_pass http://mediamtx_api/; proxy_set_header Host mediamtx; proxy_set_header X-Forwarded-Proto http; }
        location / { return 404; }
    }
}
