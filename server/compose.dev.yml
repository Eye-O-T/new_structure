    - uvicorn
    - server.services.analysis.app.main:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    - --reload
    - --reload-dir
    - /workspace/server/services/analysis
    - --reload-dir
    - /workspace/lib
