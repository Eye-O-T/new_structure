# NVIDIA GPU가 있는 호스트에서만 기본 compose와 함께 사용한다.
services:
  preprocessing:
    gpus: all
    environment:
      LD_LIBRARY_PATH: /usr/local/lib/python3.11/site-packages/nvidia/cudnn/lib:/usr/local/lib/python3.11/site-packages/nvidia/cublas/lib:/usr/local/lib/python3.11/site-packages/nvidia/cuda_runtime/lib:/usr/local/lib/python3.11/site-packages/nvidia/cufft/lib:/usr/local/lib/python3.11/site-packages/nvidia/curand/lib:/usr/local/lib/python3.11/site-packages/nvidia/cusparse/lib:/usr/local/lib/python3.11/site-packages/nvidia/cusolver/lib:/usr/local/lib/python3.11/site-packages/nvidia/nvjitlink/lib:/usr/local/lib/python3.11/site-packages/nvidia/cuda_nvrtc/lib
    build:
      args:
        TORCH_INDEX_URL: ${PREPROCESSING_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cu128}
