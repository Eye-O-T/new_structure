logLevel: info
logDestinations: [stdout]
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 512

# RTSP publishers and readers are authenticated here. HLS and Playback stay on
# the Compose network and user-facing HTTP access is protected by Nginx
# auth_request; their MediaMTX actions remain excluded or explicitly allowed.
authMethod: http
authHTTPAddress: http://external:8000/internal/media-auth
authHTTPExclude:
  - action: playback
  - action: api
  - action: metrics
  - action: pprof

api: yes
apiAddress: :9997
apiEncryption: no
apiAllowOrigin: ""

metrics: no
pprof: no

playback: yes
playbackAddress: :9996
playbackEncryption: no
playbackAllowOrigin: ""

rtsp: yes
protocols: [tcp]
encryption: "no"
rtspAddress: :8554
rtspAuthMethods: [basic]

# Protocols outside the selected RTSP -> HLS path are disabled to keep the
# deployment surface small.
rtmp: no
hls: yes
hlsAddress: :8888
hlsEncryption: no
hlsAllowOrigin: ""
hlsAlwaysRemux: no
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsDirectory: ""
hlsMuxerCloseAfter: 60s
webrtc: no
srt: no

pathDefaults:
  source: publisher
  sourceOnDemand: no
  maxReaders: 0
  record: yes
  recordPath: /recordings/%path/%Y/%m/%d/%Y%m%dT%H%M%S-%fZ
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 60s

  # Retention is owned by Data Service so that file deletion and SQLite state
  # can be reconciled together.
  recordDeleteAfter: 0s
  overridePublisher: no
  runOnRecordSegmentComplete: /usr/local/bin/recording-complete-hook

paths:
  all_others:
