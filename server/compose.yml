# 여섯 서비스의 실행 방법을 한곳에서 정의한다. 폴더도 services/<서비스명>에 맞춘다.
# ${변수:-기본값}은 배포 env에 값이 없을 때 오른쪽 기본값을 쓰는 Compose 문법이다.
name: ${COMPOSE_PROJECT_NAME:-ai-cctv}

# &이름은 공통 설정을 저장하고 *이름은 재사용한다. 네 Python 서비스의 준비 상태를 확인한다.
x-python-healthcheck: &python-healthcheck
  test:
    - CMD
    - python
    - -c
    - >-
      import urllib.request;
      urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 20s

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  # DB 파일은 Data만 직접 연다. 다른 컨테이너는 인증된 내부 API로 요청한다.
  data:
    build:
      context: ..
      dockerfile: server/services/data/Dockerfile
    image: ai-cctv-data:${AI_CCTV_VERSION:-0.3.0}
    user: ${AI_CCTV_UID:-1000}:${AI_CCTV_GID:-1000}
    init: true
    restart: unless-stopped
    env_file:
      - ${DATA_SECRETS_FILE:-./secrets/data.env}
    environment:
      AI_CCTV_CONFIG_FILE: /app/config/config.yaml
      AI_CCTV_DATABASE_PATH: /data/database/ai_cctv.db
      RECORDINGS_ROOT: /recordings
      SNAPSHOTS_ROOT: /snapshots
      # 기존 Data 설정 이름과 공통 설정 이름이 같은 호스트 저장소를 가리키게 한다.
      DATA_DATABASE_PATH: /data/database/ai_cctv.db
      DATA_STORAGE_ROOT: /recordings
      DATA_SNAPSHOT_ROOT: /snapshots
      DATA_BACKUP_ROOT: /data/database/backups
      DATA_JOB_MAX_AGE_DAYS: ${DATA_JOB_MAX_AGE_DAYS:-30}
      IDENTITY_MATCH_THRESHOLD: ${IDENTITY_MATCH_THRESHOLD:-0.97}
      IDENTITY_MATCH_MARGIN: ${IDENTITY_MATCH_MARGIN:-0.05}
      RECOVERY_DATA_BASE_URL: http://127.0.0.1:8000/internal/v1
      RECOVERY_POLL_INTERVAL_SECONDS: ${RECOVERY_POLL_INTERVAL_SECONDS:-5}
      RECOVERY_MAX_ATTEMPTS: ${RECOVERY_MAX_ATTEMPTS:-3}
      RECOVERY_RETRY_BASE_SECONDS: ${RECOVERY_RETRY_BASE_SECONDS:-30}
      RECOVERY_SETTLE_SECONDS: ${RECOVERY_SETTLE_SECONDS:-15}
      RECOVERY_TIMEOUT_SECONDS: ${RECOVERY_TIMEOUT_SECONDS:-30}
      RECOVERY_JOB_TIMEOUT_SECONDS: ${RECOVERY_JOB_TIMEOUT_SECONDS:-1800}
      CENTRAL_RECORDING_SEGMENT_SECONDS: ${RECORDING_SEGMENT_SECONDS:-60}
      TZ: UTC
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${CONFIG_FILE:-./config/config.yaml}
        target: /app/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATABASE_DIR:-./runtime/database}
        target: /data/database
        bind:
          create_host_path: false
      - type: bind
        source: ${RECORDINGS_DIR:-./runtime/recordings}
        target: /recordings
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOTS_DIR:-./runtime/snapshots}
        target: /snapshots
        bind:
          create_host_path: false
      - type: bind
        source: ${RECOVERED_DIR:-./runtime/recovered}
        # 호스트의 복구 영상은 별도 폴더지만 Data 안에서는 녹화 폴더의 하위로 보인다.
        # 따라서 호스트 백업 시 RECORDINGS_DIR와 RECOVERED_DIR를 각각 보존해야 한다.
        target: /recordings/recovered
        bind:
          create_host_path: false
    healthcheck: *python-healthcheck
    networks:
      - internal
    logging: *service-logging

  # 앱의 로그인·권한·공개 API와 푸시 발송을 담당한다. SQLite는 마운트하지 않는다.
  external:
    build:
      context: ..
      dockerfile: server/services/external/Dockerfile
    image: ai-cctv-external:${AI_CCTV_VERSION:-0.3.0}
    init: true
    restart: unless-stopped
    env_file:
      - ${EXTERNAL_SECRETS_FILE:-./secrets/external.env}
    environment:
      AI_CCTV_CONFIG_FILE: /app/config/config.yaml
      DATA_SERVICE_URL: http://nginx:8080/internal/data/v1
      DATA_BASE_URL: http://nginx:8080/internal/data/v1
      DATA_HEALTH_URL: http://nginx:8080/internal/data/health/ready
      MEDIA_CONTROL_URL: http://nginx:8080/internal/media
      MEDIA_CONTROL_TIMEOUT_SECONDS: ${MEDIA_CONTROL_TIMEOUT_SECONDS:-5}
      PREPROCESSING_HEALTH_URL: ${PREPROCESSING_HEALTH_URL:-http://preprocessing:8000/health/ready}
      SYSTEM_PROBE_TIMEOUT_SECONDS: ${SYSTEM_PROBE_TIMEOUT_SECONDS:-3}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      PUBLIC_HLS_PREFIX: /hls
      PUBLIC_PLAYBACK_PREFIX: /playback
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EDGE_STATUS_POLL_INTERVAL_SECONDS: ${EDGE_STATUS_POLL_INTERVAL_SECONDS:-5}
      EDGE_CONTROL_TIMEOUT_SECONDS: ${EDGE_CONTROL_TIMEOUT_SECONDS:-75}
      EDGE_STATUS_TIMEOUT_SECONDS: ${EDGE_STATUS_TIMEOUT_SECONDS:-5}
      EDGE_EVENT_PAGE_LIMIT: ${EDGE_EVENT_PAGE_LIMIT:-100}
      BATTERY_LOW_PERCENT: ${BATTERY_LOW_PERCENT:-20}
      BATTERY_CRITICAL_PERCENT: ${BATTERY_CRITICAL_PERCENT:-10}
      STORAGE_WARNING_PERCENT: ${STORAGE_WARNING_PERCENT:-85}
      STORAGE_CRITICAL_PERCENT: ${STORAGE_CRITICAL_PERCENT:-95}
      TZ: UTC
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${CONFIG_FILE:-./config/config.yaml}
        target: /app/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      data:
        condition: service_healthy
    healthcheck: *python-healthcheck
    networks:
      - internal
    logging: *service-logging

  mediamtx:
    build:
      context: ./services/mediamtx
      dockerfile: Dockerfile
      args:
        MEDIAMTX_UPSTREAM_IMAGE: ${MEDIAMTX_UPSTREAM_IMAGE:-bluenviron/mediamtx:1.9.0}
        MEDIAMTX_WRAPPER_BASE_IMAGE: ${MEDIAMTX_WRAPPER_BASE_IMAGE:-alpine:3.20.3}
    image: ai-cctv-mediamtx:1.9.0
    user: ${AI_CCTV_UID:-1000}:${AI_CCTV_GID:-1000}
    init: true
    restart: unless-stopped
    env_file:
      - ${MEDIA_SECRETS_FILE:-./secrets/media.env}
    environment:
      TZ: UTC
      # 녹화 길이를 Data와 공유하여 완료 알림이 유실돼도 같은 시간 구간으로 복원한다.
      MTX_PATHDEFAULTS_RECORDSEGMENTDURATION: ${RECORDING_SEGMENT_SECONDS:-60}s
    ports:
      - target: 8554
        published: ${RTSP_PORT:-8554}
        host_ip: ${RTSP_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    expose:
      - "8888"
      - "9996"
      - "9997"
    volumes:
      - type: bind
        source: ./services/mediamtx/mediamtx.yml
        target: /etc/mediamtx.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${RECORDINGS_DIR:-./runtime/recordings}
        target: /recordings
        bind:
          create_host_path: false
    depends_on:
      external:
        # External의 준비 검사는 Nginx를 사용한다. 여기서 준비 완료까지 기다리면
        # 서로의 기동을 기다리는 순환이 생기므로 프로세스 시작만 확인한다.
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:9997/v3/config/global/get
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - internal
    logging: *service-logging

  # 외부 HTTPS와 내부 HTTP 중계 역할을 함께 맡지만 8080은 호스트에 공개하지 않는다.
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27.2-alpine}
    init: true
    restart: unless-stopped
    ports:
      - target: 80
        published: ${PUBLIC_HTTP_PORT:-80}
        host_ip: ${PUBLIC_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
      - target: 443
        published: ${PUBLIC_HTTPS_PORT:-443}
        host_ip: ${PUBLIC_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ./services/nginx/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CERTS_DIR:-./runtime/certificates}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      data:
        condition: service_healthy
      external:
        condition: service_started
      mediamtx:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "wget -q -O - http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - internal
    logging: *service-logging

  # 감지와 인물 연결은 같은 컨테이너 안에서 독립 실행하며 서로 다른 Data 토큰을 쓴다.
  preprocessing:
    build:
      context: ..
      dockerfile: server/services/preprocessing/Dockerfile
    image: ai-cctv-preprocessing:${AI_CCTV_VERSION:-0.3.0}
    # 작업자 종료 상한(최대 60초)과 자식 모델 정리 시간을 보장한다.
    stop_grace_period: 75s
    user: ${AI_CCTV_UID:-1000}:${AI_CCTV_GID:-1000}
    init: true
    restart: unless-stopped
    # 영상·DB와 CPU가 경합하면 감지의 우선순위를 낮추고 메모리 점유를 제한한다.
    cpu_shares: 512
    mem_limit: ${PREPROCESSING_MEMORY_LIMIT:-4g}
    pids_limit: 512
    env_file:
      - ${PREPROCESSING_SECRETS_FILE:-./secrets/preprocessing.env}
    environment:
      DETECTION_PLUGIN: ${DETECTION_PLUGIN:-server.services.preprocessing.processors.detection.yolo:YoloTracker}
      IDENTITY_PLUGIN: ${IDENTITY_PLUGIN:-server.services.preprocessing.processors.identity:OsNetIdentity}
      IDENTITY_MODEL_PATH: ${IDENTITY_MODEL_PATH-/models/osnet_x0_25_msmt17.onnx}
      OBJECT_MODEL_TIMEOUT_SECONDS: ${OBJECT_MODEL_TIMEOUT_SECONDS:-120}
      OBJECT_STARTUP_TIMEOUT_SECONDS: ${OBJECT_STARTUP_TIMEOUT_SECONDS:-30}
      RTSP_TIMEOUT_SECONDS: ${RTSP_TIMEOUT_SECONDS:-5}
      MODEL_RETRY_SECONDS: ${MODEL_RETRY_SECONDS:-30}
      DETECTION_SHUTDOWN_SECONDS: ${DETECTION_SHUTDOWN_SECONDS:-15}
      DETECTION_MODEL_TIMEOUT_SECONDS: ${DETECTION_MODEL_TIMEOUT_SECONDS:-10}
      DETECTION_STARTUP_TIMEOUT_SECONDS: ${DETECTION_STARTUP_TIMEOUT_SECONDS:-30}
      OBSERVATION_WINDOW_SECONDS: ${OBSERVATION_WINDOW_SECONDS:-1}
      OBSERVATION_BUFFER_MAX_BYTES: ${OBSERVATION_BUFFER_MAX_BYTES:-33554432}
      EVENT_OUTBOX_MAX_PENDING: ${EVENT_OUTBOX_MAX_PENDING:-10000}
      EVENT_OUTBOX_MAX_BYTES: ${EVENT_OUTBOX_MAX_BYTES:-67108864}
      AI_CCTV_CONFIG_FILE: /app/config/config.yaml
      DATA_SERVICE_URL: http://nginx:8080/internal/data/v1
      MEDIAMTX_RTSP_BASE_URL: rtsp://mediamtx:8554
      SNAPSHOTS_ROOT: /snapshots
      MODEL_FILE: ${MODEL_FILE:-default.pt}
      MODEL_PATH: /models/${MODEL_FILE:-default.pt}
      TZ: UTC
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${CONFIG_FILE:-./config/config.yaml}
        target: /app/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODELS_DIR:-./runtime/models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOTS_DIR:-./runtime/snapshots}
        target: /snapshots
        bind:
          create_host_path: false
    depends_on:
      mediamtx:
        condition: service_healthy
      nginx:
        condition: service_healthy
    healthcheck: *python-healthcheck
    networks:
      - internal
    logging: *service-logging


  # 기본 CPU 분석을 제공하며 플러그인으로 교체할 수 있다. 모델·스냅샷은 읽기 전용이다.
  analysis:
    build:
      context: ..
      dockerfile: server/services/analysis/Dockerfile
    image: ai-cctv-analysis:${AI_CCTV_VERSION:-0.3.0}
    user: ${AI_CCTV_UID:-1000}:${AI_CCTV_GID:-1000}
    init: true
    restart: unless-stopped
    env_file:
      - ${ANALYSIS_SECRETS_FILE:-./secrets/analysis.env}
    environment:
      ANALYSIS_PLUGIN: ${ANALYSIS_PLUGIN:-server.services.analysis.processors:LocalAppearanceAnalyzer}
      OBJECT_MODEL_TIMEOUT_SECONDS: ${OBJECT_MODEL_TIMEOUT_SECONDS:-120}
      OBJECT_STARTUP_TIMEOUT_SECONDS: ${OBJECT_STARTUP_TIMEOUT_SECONDS:-30}
      DATA_SERVICE_URL: http://nginx:8080/internal/data/v1
      SNAPSHOTS_ROOT: /snapshots
      TZ: UTC
    volumes:
      - type: bind
        source: ${SNAPSHOTS_DIR:-./runtime/snapshots}
        target: /snapshots
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MODELS_DIR:-./runtime/models}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      nginx:
        condition: service_healthy
    expose: ["8000"]
    healthcheck: *python-healthcheck
    networks: [internal]
    logging: *service-logging

networks:
  # 이름이 internal이어도 네트워크 자체의 격리 옵션 internal: true를 뜻하지는 않는다.
  # 컨테이너는 서비스 이름(data, nginx 등)을 DNS 이름으로 사용한다.
  internal:
    name: ${COMPOSE_PROJECT_NAME:-ai-cctv}_internal
    driver: bridge
