user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format structured escape=json
        '{"timestamp":"$time_iso8601",'
        '"service":"nginx",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time}';

    access_log /var/log/nginx/access.log structured;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 2m;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream external_service {
        server external:8000;
        keepalive 16;
    }

    upstream data_service {
        server data:8000;
        keepalive 16;
    }

    upstream mediamtx_hls {
        server mediamtx:8888;
        keepalive 16;
    }

    upstream mediamtx_playback {
        server mediamtx:9996;
        keepalive 16;
    }

    upstream mediamtx_api {
        server mediamtx:9997;
        keepalive 8;
    }

    # Plain HTTP exists only for a health probe and HTTPS redirection.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        location / {
            return 308 https://$host$request_uri;
        }
    }

    # The only public application listener.
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # No trailing slash on proxy_pass: the External Service owns /api/v1
        # routes and must receive the public prefix unchanged.
        location ^~ /api/ {
            proxy_pass http://external_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Each HLS playlist and media-segment request is authenticated before
        # Nginx strips /hls/ and forwards the MediaMTX-native path.
        location ^~ /hls/ {
            auth_request /_auth;
            proxy_pass http://mediamtx_hls/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            add_header Cache-Control "private, no-store" always;
        }

        # Range is preserved for fMP4/MP4 playback. As with HLS, the public
        # prefix is removed before the request reaches MediaMTX.
        location ^~ /playback/ {
            auth_request /_auth;
            proxy_pass http://mediamtx_playback/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location = /_auth {
            internal;
            proxy_pass http://external_service/internal/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
        }

        # The public listener never exposes service-to-service routes.
        location ^~ /internal/ {
            return 404;
        }

        location / {
            return 404;
        }
    }

    # Docker-network-only relay. Compose deliberately does not publish 8080.
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        client_max_body_size 2m;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # The trailing slash on proxy_pass maps
        # /internal/data/v1/... to Data Service /internal/v1/....
        location ^~ /internal/data/v1/ {
            proxy_pass http://data_service/internal/v1/;
            proxy_set_header Host data;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Internal-Token $http_x_internal_token;
        }

        # Readiness is outside Data Service's /internal/v1 router but External
        # still reaches it through this Docker-only listener.
        location ^~ /internal/data/health/ {
            proxy_pass http://data_service/health/;
            proxy_set_header Host data;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Internal-Token $http_x_internal_token;
        }

        # MediaMTX v1.9 Control API paths are rooted at /v3/. The trailing
        # slash removes /internal/media/ before proxying.
        location ^~ /internal/media/ {
            proxy_pass http://mediamtx_api/;
            proxy_set_header Host mediamtx;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $request_id;
        }

        location / {
            return 404;
        }
    }
}
