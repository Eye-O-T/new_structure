[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cctv-edge"
version = "0.3.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1"]

[project.scripts]
ai-cctv-edge = "ai_cctv_edge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
