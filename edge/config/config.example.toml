schema_version = 1
device_id = "edge-001"
camera_id = "cam-001"

[video]
profile = "hd"
width = 1280
height = 720
fps = 30
bitrate_kbps = 2000
encoder = "x264enc"
supported_profiles = ["hd", "fhd"]

[rtsp]
mode = "central_publish"
central_host = "192.0.2.10"
central_port = 8554
edge_port = 8554
username = "cam-001"
password_file = "/etc/ai-cctv-edge/publish.password"
mediamtx_binary = "/usr/lib/ai-cctv-edge/mediamtx"

[backup]
root = "/var/lib/ai-cctv-edge/recordings"
segment_seconds = 10
max_bytes = 21474836480
max_age_hours = 24

[recovery]
bind_host = "0.0.0.0"
port = 8002
token_file = "/etc/ai-cctv-edge/recovery.token"

[control]
bind_host = "0.0.0.0"
port = 8003
# The management, status and recovery services share this edge_auth_token.
token_file = "/etc/ai-cctv-edge/recovery.token"
apply_timeout_seconds = 30
preflight_timeout_seconds = 10

[monitoring]
interval_seconds = 5
frame_timeout_seconds = 5
battery_low_percent = 20
battery_critical_percent = 10
