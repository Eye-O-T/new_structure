<text x="935.0" y="163.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#172b4d">등장 이미지 저장</text>
<text x="935.0" y="192.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">원본 · 사람 크롭 · 박스 JPEG</text>
<text x="935.0" y="219.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">공유 /snapshots에 먼저 저장</text>
