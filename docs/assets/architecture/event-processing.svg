<text x="185.0" y="621.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">crop 1장 → OSNet 특징 추출</text>
<text x="185.0" y="648.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">512차원 반환 → Data에서 ID 연결</text>
<text x="185.0" y="675.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">준비한 OSNet ONNX / CPU 실행</text>
<rect x="405" y="565" width="310" height="120" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
