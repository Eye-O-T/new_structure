<text x="560.0" y="192.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">등장: 대표 프레임 1장</text>
<text x="560.0" y="219.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">사라짐: 감지 공백 기준 판정</text>
