<rect width="1120" height="1000" fill="#ffffff"/>
<text x="32" y="43" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#172b4d">03  사람 감지 · 이벤트 · 후속 분석</text>
<text x="32" y="76" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#475569">대표 이미지를 먼저 저장하고, Data가 감지 기록과 독립 작업을 함께 만든다.</text>
