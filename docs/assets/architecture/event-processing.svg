<text x="185.0" y="192.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">RTSP 수신 → 사람 감지·추적</text>
<text x="185.0" y="219.0" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">카메라 · 추적 세션 · 로컬 ID</text>
