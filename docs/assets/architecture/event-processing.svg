<path d="M 935 685 L 935 805" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linejoin="round"/>
<polygon points="935,805 930.0,794.0 940.0,794.0" fill="#2563eb"/>
<rect x="878.5" y="734" width="113.0" height="23" rx="4" fill="#ffffff"/>
<text x="935" y="752" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#2563eb">Firebase 경유</text>
<text x="32" y="947" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#475569">점선 상자는 교체 가능한 처리기다. OSNet은 사전 준비가 필요하며, 인물 연결 점수는 동일인 확률이 아니다.</text>
<text x="32" y="974" font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#475569">작업은 5분 동안 임대하고 최대 5회 시도한다. 늦은 완료는 거부하며, 후속 결과 갱신은 추가 푸시를 만들지 않는다.</text>
