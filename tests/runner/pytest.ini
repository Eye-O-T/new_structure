[pytest]
# --rootdir=. 옵션과 함께 저장소 루트에서 실행한다.
addopts = -ra -p no:cacheprovider -p tests.runner.pytest_plugin
asyncio_default_fixture_loop_scope = function
pythonpath = ../.. ../../lib ../../edge/src
testpaths = tests/automated server/services/data/tests server/services/external/tests server/services/preprocessing/tests server/services/analysis/tests
